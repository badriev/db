# Сервисы разнесены по profiles, чтобы не держать всё поднятым одновременно:
#   docker compose --profile oltp up -d
# Профили olap / nosql / cdc появятся по мере прохождения курса.
name: dbcourse

services:
  postgres:
    image: postgres:18
    profiles: [oltp]
    environment:
      POSTGRES_USER: ${PG_USER:-student}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-student}
      POSTGRES_DB: ${PG_DB:-shop}
      PG_TEST_DB: ${PG_TEST_DB:-shop_test}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_wal_size=4GB
      - -c
      - timezone=UTC
      - -c
      - log_min_duration_statement=1000
    ports:
      - "${PG_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    shm_size: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
