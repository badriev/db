[project]
name = "dbcourse"
version = "0.1.0"
description = "Курс по базам данных: OLTP, OLAP, NoSQL на Python и чистом SQL"
requires-python = ">=3.12"
# Драйверы для ClickHouse / Mongo / Redis / Cassandra добавятся в своих модулях.
dependencies = [
    "psycopg[binary,pool]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-ra -q"
